description: 'ZhongAn Online P&C Insurance Co., Ltd. is China''s first online-only insurance company,
  founded in 2013 by Ant Financial, Tencent, and Ping An and listed on the Hong Kong Stock Exchange
  (6060) in 2017. Headquartered in Shanghai, ZhongAn sells digital insurance across health, consumer
  finance, auto, and lifestyle lines entirely through internet channels, and operates a partner
  "open platform" (open.zhongan.com) plus a technology arm, ZhongAn Technology (zhongan.io), that
  offers insurtech and cloud services. ZhongAn does not publish a self-serve public developer API
  program or OpenAPI documentation; integration is partner/ecosystem-driven. This profile was
  surfaced as a portfolio company of softbank-vision-fund and enriched by the API Evangelist pipeline.'
